<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAYATSIZ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0c;
      color: #ffffff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Yenilenmiş Modern Giriş Butonu */
    #enter-btn {
      position: relative;
      padding: 18px 42px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Hover Parlama Efekti */
    #enter-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: 0.5s;
    }

    #enter-btn:hover::before {
      left: 100%;
    }

    #enter-btn:hover {
      transform: scale(1.08);
      border-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
    }

    #enter-btn:active {
      transform: scale(0.96);
    }

    /* Ana İçerik Konteyneri */
    #content {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Profil Resmi */
    .profile-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
    }

    /* Alt Yazı */
    .status-text {
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #a0a0a0;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: scale(0.9) translateY(10px); 
      }
      to { 
        opacity: 1; 
        transform: scale(1) translateY(0); 
      }
    }
  </style>
</head>
<body>

  <!-- Müzik Dosyası -->
  <audio id="bg-music" src="music1.mp3" loop></audio>

  <!-- Giriş Butonu -->
  <button id="enter-btn" onclick="enterSite()">İçeri Gir</button>

  <!-- Butona Basıldıktan Sonra Açılacak İçerik -->
  <div id="content">
    <img src="pp1.jpg" alt="Profil Resmi" class="profile-img" />
    <p class="status-text">Yapım Aşamasında</p>
  </div>

  <script>
    function enterSite() {
      const music = document.getElementById('bg-music');
      music.loop = true;
      music.play();

      document.getElementById('enter-btn').style.display = 'none';
      document.getElementById('content').style.display = 'flex';
    }
  </script>

</body>
</html>
